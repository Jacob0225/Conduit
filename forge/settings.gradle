pluginManagement {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.5.0"
}

rootProject.name = "conduit-forge"
include "forge-1.20.1", "forge-1.21.1", "forge-1.21.11", "forge-26.1", "forge-26.2"
