plugins {
    id "net.minecraftforge.gradle" version "[6.0,6.2)" apply false
}

def targets = [
        "forge-1.20.1": [minecraft: "1.20.1", forge: "47.4.9", java: 17],
        "forge-1.21.1": [minecraft: "1.21.1", forge: "52.1.9", java: 21],
        "forge-1.21.11": [minecraft: "1.21.11", forge: "61.1.9", java: 25],
        "forge-26.1": [minecraft: "26.1", forge: "62.0.9", java: 25],
        "forge-26.2": [minecraft: "26.2", forge: "65.0.3", java: 25],
]

subprojects {
    apply plugin: "net.minecraftforge.gradle"

    def target = targets[project.name]
    group = "com.jacob0225"
    version = target.minecraft + "-1.0.0"

    base {
        archivesName = "conduit-forge-" + target.minecraft
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(target.java)
        }
        withSourcesJar()
    }

    minecraft {
        mappings channel: "official", version: target.minecraft
        copyIdeResources = true
        runs {
            configureEach {
                workingDirectory project.file("run")
                mods {
                    conduit {
                        source sourceSets.main
                    }
                }
            }
            client {}
            server { args "--nogui" }
        }
    }

    sourceSets {
        main {
            java {
                srcDir "../../src/main/java"
                srcDir "../src/main/java"
                exclude "com/jacob0225/conduit/Conduit.java"
            }
            resources.srcDir "../src/main/resources"
        }
    }

    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraftforge:forge:" + target.minecraft + "-" + target.forge
    }

    tasks.named("processResources", ProcessResources).configure {
        inputs.properties([
                minecraft_version: target.minecraft,
                forge_loader_range: "[" + target.forge.tokenize(".")[0] + ",)",
                java_version: target.java,
                mod_version: project.version
        ])
        filesMatching("META-INF/mods.toml") {
            expand(inputs.properties)
        }
    }
}
