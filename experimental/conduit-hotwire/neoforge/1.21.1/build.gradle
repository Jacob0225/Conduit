plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir 'src/client/java'
    java.srcDir '../../shared' // ConduitSounds + the (reflection-only) Hotwire bridge
    java.exclude '**/HotwireServerSwitch.java' // Fabric-only (26.3 server switching)
    resources.srcDir 'src/client/resources'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
        // Dev only: -Dconduit.autotest=host:port joins, downloads, loads live and reports (see AutoJoinTest).
        client { systemProperty 'conduit.autotest', project.findProperty('autotest') ?: '' }
    }
    mods { conduit { sourceSet sourceSets.main } }
}

processResources {
    inputs.properties(version: project.version, minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version, loader_version_range: project.loader_version_range)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minecraft_version_range: project.minecraft_version_range,
                neo_version: project.neo_version, loader_version_range: project.loader_version_range)
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
java { withSourcesJar() }
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
publishing { publications { create('mavenJava', MavenPublication) { from components.java } } }
