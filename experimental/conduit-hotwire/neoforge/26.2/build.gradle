plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    java.srcDir 'src/client/java'
    java.srcDir '../../shared' // ConduitSounds + the (reflection-only) Hotwire bridge
    java.exclude '**/HotwireServerSwitch.java' // Fabric-only (26.3 server switching)
    resources.srcDir 'src/client/resources'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        conduit { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.properties(version: project.version, minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minecraft_version_range: project.minecraft_version_range,
                neo_version: project.neo_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java { withSourcesJar() }

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
