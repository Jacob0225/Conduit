plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir 'src/client/java'
    java.srcDir '../../shared' // ConduitSounds + the (reflection-only) Hotwire bridge
    java.exclude '**/HotwireServerSwitch.java' // Fabric-only (26.3 server switching)
    resources.srcDir 'src/client/resources'
}

// Forge loads a dev mod from one folder: build classes and resources into the same one (as the MDK does).
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run') }
        register('client') {
            // Dev-only end-to-end test: -Pautotest=host:port [-PautotestMods=id1,id2]
            systemProperty 'conduit.autotest', (project.findProperty('autotest') ?: '').toString()
            systemProperty 'conduit.autotest.mods', (project.findProperty('autotestMods') ?: '').toString()
            // A dev run has no jar manifest, so Mixin doesn't see the MixinConfigs attribute.
            args '--mixin.config', 'conduit.mixins.json', '--mixin.config', 'conduit.client.mixins.json'
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui', '--mixin.config', 'conduit.mixins.json'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
}

processResources {
    def props = [version: project.version, minecraft_version_range: project.minecraft_version_range,
                 forge_version_range: project.forge_version_range, loader_version_range: project.loader_version_range]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand(props) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
java { withSourcesJar() }
jar {
    manifest.attributes('MixinConfigs': 'conduit.mixins.json,conduit.client.mixins.json')
}

