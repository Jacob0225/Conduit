// Test fixture for the mixin splitter: one mixin per case, all aimed at classes
// that are already loaded on the title screen (plus one that isn't).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.0.0'
base { archivesName = 'hotmixin' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods { hotmixin { sourceSet sourceSets.main } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
